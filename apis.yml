name: Esperion Therapeutics
description: >-
  Esperion Therapeutics, Inc. (Nasdaq: ESPR) is a commercial-stage
  pharmaceutical company based in Ann Arbor, Michigan, focused on discovering,
  developing, and commercializing innovative medicines that lower LDL
  cholesterol and reduce cardiovascular risk. Its lead products are NEXLETOL
  (bempedoic acid) and NEXLIZET (bempedoic acid and ezetimibe), oral,
  once-daily, non-statin therapies indicated to lower elevated LDL-C in adults.
  As a life-sciences company, Esperion operates a corporate and scientific
  marketing web presence rather than a developer program; it publishes no
  public API, developer portal, SDKs, or technical documentation. This profile
  was added to the API Evangelist network as a venture-portfolio lead and
  enriched with verifiable company identity and domain-security signals only.
